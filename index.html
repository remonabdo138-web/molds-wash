<title>غسيل الاسطمبات</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column, phone first. Header with date, tab strip, one view at a time.
   Palette: cooling-water teal on cool steel greys; washers get a violet-grey tint. */
:root{
  color-scheme:light; --bg:#edf2f4; --surface:#ffffff; --ink:#13232b; --muted:#566a74; --line:#d3dde2;
  --accent:#0b7a86; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --wash-soft:#e7e5f5; --wash-ink:#403a78;
  --ok:#1b7447; --ok-soft:#dbf0e4; --warn:#9a5a00; --warn-soft:#faebd0; --bad:#b3261e; --bad-soft:#f8dddb;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a20; --surface:#16252d; --ink:#e5eef1; --muted:#93a7b1; --line:#293b45;
  --accent:#4cc3cf; --accent-ink:#04252a; --accent-soft:#123740;
  --wash-soft:#26233f; --wash-ink:#bdb7f0;
  --ok:#5fd394; --ok-soft:#133323; --warn:#f2b45a; --warn-soft:#3a2a0e; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a20; --surface:#16252d; --ink:#e5eef1; --muted:#93a7b1; --line:#293b45;
  --accent:#4cc3cf; --accent-ink:#04252a; --accent-soft:#123740;
  --wash-soft:#26233f; --wash-ink:#bdb7f0;
  --ok:#5fd394; --ok-soft:#133323; --warn:#f2b45a; --warn-soft:#3a2a0e; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
header{padding-block:18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:0}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
nav button:focus-visible,.btn:focus-visible,.chk:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.hero{display:grid;gap:12px}
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.row-flex{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
ul.list{list-style:none;margin:0;padding:0}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk{flex:none;width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.chk:hover{border-color:var(--accent)}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.chk[disabled]{opacity:.5;cursor:default}
.mt{min-width:0;flex:1}
.nm{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px;font-size:12.5px;color:var(--muted)}
.code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.chip{border-radius:6px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500}
.chip[data-k="w"]{background:var(--wash-soft);color:var(--wash-ink)}
.chip[data-k="o"]{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
.tag.late{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.mute{background:var(--bg);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.note{border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{padding:14px}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
h2{font-size:16px;margin:20px 0 8px;font-weight:700}
details.day{border-top:1px solid var(--line)}
details.day:first-child{border-top:0}
details.day>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary span:last-child{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
@media(min-width:560px){.filters{grid-template-columns:2fr 1.2fr 1fr}}
input[type=text],input[type=search],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.exp{padding:6px 14px 14px;border-top:1px dashed var(--line);display:grid;gap:10px}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist .tag{display:inline-flex;gap:6px;align-items:center}
.hist button{border:0;background:none;color:inherit;cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.rowbtn{all:unset;display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;box-sizing:border-box}
.rowbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.gbar{display:grid;grid-template-columns:minmax(110px,1.1fr) 3fr auto;gap:10px;align-items:center;padding:7px 14px;font-size:13.5px}
.gbar .bar{height:8px}
.gbar span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:left}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 14px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
.scroll{overflow-x:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
#toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
#toast div{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 16px;max-width:90%;font-size:14px}
@media(prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

</head><body>
<div class="wrap">

  </header>
  <nav id="tabs" role="tablist" aria-label="الأقسام"></nav>
  <div id="notes"></div>
  <main id="view"></main>
</div>
<div id="toast" aria-live="polite"></div>

let C=null;   // computed

function compute(){
  const cfg=S.cfg,T=toN(todayISO()),cs0=cycleStart(cfg.baseStart,0),pre=T<cs0;
  let k=0;if(!pre){while(cycleStart(cfg.baseStart,k+1)<=T)k++}
  const cs=cycleStart(cfg.baseStart,k),ncs=cycleStart(cfg.baseStart,k+1);
  const done=new Map(),last=new Map();
  for(const w of S.washes){const n=toN(w.date);
    if(!last.has(w.code)||last.get(w.code)<n)last.set(w.code,n);
    const inCyc=w.cyc!=null?w.cyc===k:(n>=cs&&n<ncs);
    if(inCyc&&(!done.has(w.code)||done.get(w.code).n<n))done.set(w.code,{n,w})}
  const order=S.molds.slice().sort((a,b)=>((a.d==null?1e9:a.d)-(b.d==null?1e9:b.d))||(a.s-b.s));
  const rem=order.filter(m=>!done.has(m.c));
  const pinOf=m=>{if(!m.p)return null;const n=toN(m.p);return(n>=cs&&n<ncs)?n:null};
  const lateDays=m=>{const pn=pinOf(m);if(pn!=null)return(!pre&&pn<T)?T-pn:0;return(m.d&&!pre&&cs+m.d-1<T)?T-(cs+m.d-1):0};
  const overdue=rem.filter(m=>lateDays(m)>0);
  const todayDone=order.filter(m=>done.has(m.c)&&done.get(m.c).n===T);
  const start=Math.max(T,cs),days=[];let idx=0;
  const capOf=n=>dow(n)===5?cfg.friCap:cfg.perDay;
  const rest=rem.filter(m=>pinOf(m)==null),pinByDay=new Map();let lastPin=-1;
  rem.filter(m=>pinOf(m)!=null).forEach(m=>{const pd=Math.max(pinOf(m),start);if(!pinByDay.has(pd))pinByDay.set(pd,[]);pinByDay.get(pd).push(m);lastPin=Math.max(lastPin,pd)});
  for(let n=start;(idx<rest.length||n<=lastPin)&&n<start+600;n++){
    const pins=pinByDay.get(n)||[];
    let cap=capOf(n);if(n===T&&!pre)cap=Math.max(0,cap-todayDone.length);
    cap=Math.max(0,cap-pins.length);
    if(cap<=0&&!pins.length&&!(n===T&&!pre))continue;
    const items=pins.concat(rest.slice(idx,idx+cap));idx+=items.length-pins.length;days.push({n,items})}
  const doneCount=order.length-rem.length;
  const expected=order.filter(m=>m.d&&cs+m.d-1<=T).length;
  const finish=days.length?days[days.length-1].n:null;
  let prevMissed=null;
  if(k>0&&S.loaded.w){const ps=cycleStart(cfg.baseStart,k-1),seen=new Set();
    for(const w of S.washes){const n=toN(w.date);if(w.cyc!=null?w.cyc===k-1:(n>=ps&&n<cs))seen.add(w.code)}
    prevMissed=order.filter(m=>!seen.has(m.c)).length}
  C={T,k,cs,ncs,pre,done,last,order,rem,lateDays,pinOf,overdue,todayDone,days,doneCount,expected,finish,prevMissed,capToday:capOf(T)};
  const pd=m=>{const pn=pinOf(m);return pn!=null?pn-cs+1:(m.d||null)};
  let maxD=0;order.forEach(m=>{const x=pd(m);if(x)maxD=Math.max(maxD,x)});
  const wk={};
  for(const w of S.washes){const n=toN(w.date);const ic=w.cyc!=null?w.cyc===k:(n>=cs&&n<ncs);if(!ic)continue;
    const wi=Math.floor((n-cs)/7);if(wi<0)continue;(wk[wi]=wk[wi]||new Set()).add(w.code)}
  const lastW=Object.keys(wk).reduce((a,x)=>Math.max(a,+x),-1),nW=Math.max(Math.ceil(maxD/7),lastW+1),weeks=[];
  for(let wi=0;wi<nW;wi++){const planned=order.filter(m=>{const x=pd(m);return x&&x>wi*7&&x<=wi*7+7}).length,dn=wk[wi]?wk[wi].size:0;
    weeks.push({i:wi,ws:cs+7*wi,we:cs+7*wi+6,planned,done:dn,pct:planned?Math.round(dn/planned*100):null})}
  C.weeks=weeks;C.curWeek=(!pre&&T>=cs)?Math.floor((T-cs)/7):null;
}

async function resetAll(){
  if(!canWriteNow())return;
  S.busy=true;render();
  try{
    const db=S.db,ws=await db.collection('washes').get();
    for(let i=0;i<ws.docs.length;i+=400){const bt=db.batch();ws.docs.slice(i,i+400).forEach(d=>bt.delete(d.ref));await bt.commit()}
    const ch=await db.collection('moldchunks').get(),b2=db.batch();
    ch.docs.forEach(d=>{if(!(d.id in SEED))b2.delete(d.ref)});
    Object.keys(SEED).forEach(id=>b2.set(db.collection('moldchunks').doc(id),{items:SEED[id]}));
    b2.set(db.doc('config/main'),SEED_CFG);await b2.commit();
    S.confirmReset=false;toast('اتحمّلت القايمة الجديدة واتمسح السجل القديم.');

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    off+=lh.length+nm.length+sz}

  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

const XH_=t=>t.map(v=>({v,s:1})),XP=v=>({v,s:2}),XB=v=>({v,s:3}),XL=v=>({v,s:4});
const DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function buildReport(){
  const T=C.T,cs=C.cs,ncs=C.ncs,tot=C.order.length,byCode=new Map(S.molds.map(m=>[m.c,m]));
  const pdm=m=>{const pn=C.pinOf(m);return pn!=null?pn-cs+1:(m.d||null)};
  const plannedBy=new Map();let maxD=0;
  C.order.forEach(m=>{const x=pdm(m);if(x){plannedBy.set(x,(plannedBy.get(x)||0)+1);maxD=Math.max(maxD,x)}});
  const doneBy=new Map();let before=0,lastN=cs-1;
  C.order.forEach(m=>{const d=C.done.get(m.c);if(!d)return;if(d.n<cs){before++;return}doneBy.set(d.n,(doneBy.get(d.n)||0)+1);lastN=Math.max(lastN,d.n)});
  const endN=Math.min(ncs-1,Math.max(cs+maxD-1,lastN));
  const frac=(a,b)=>b?Math.round(a/b*1000)/1000:'';
  /* يومي */
  const daily=[XH_(['التاريخ','اليوم','المخطط','المحقق','الفرق (محقق − مخطط)','نسبة إنجاز اليوم','مخطط تراكمي','محقق تراكمي','المتبقي نهاية اليوم','نسبة الإنجاز التراكمية'])];
  let cp=0,cd=before,sp=0,sd=before;
  if(before){daily.push(['قبل بداية الدورة','',0,before,before,'',0,before,tot-before,XP(frac(before,tot))])}
  for(let n=cs;n<=endN;n++){
    const p=plannedBy.get(n-cs+1)||0,past=n<=T,dn=past?(doneBy.get(n)||0):0;
    cp+=p;sp+=p;if(past){cd+=dn;sd+=dn}
    daily.push([fromN(n),DAYN[dow(n)],p,past?dn:'',past?dn-p:'',past&&p?XP(frac(dn,p)):'',cp,past?cd:'',past?tot-cd:'',past?XP(frac(cd,tot)):''])}
  daily.push([XB('الإجمالي'),'',XB(sp),XB(sd),XB(sd-sp),'','','','',''] );
  /* أسبوعي */
  const weekly=[XH_(['الأسبوع','من','إلى','المطلوب','المحقق','الفرق','النسبة'])];
  let tp=0,td=0;
  C.weeks.forEach(w=>{const fut=C.curWeek==null||w.i>C.curWeek;tp+=w.planned;if(!fut||w.done)td+=w.done;
    weekly.push([w.i+1+(w.i===C.curWeek?' (الحالي)':''),fromN(w.ws),fromN(w.we),w.planned,fut&&!w.done?'':w.done,fut&&!w.done?'':w.done-w.planned,w.planned&&!(fut&&!w.done)?XP(frac(w.done,w.planned)):''])});
  weekly.push([XB('الإجمالي'),'','',XB(tp),XB(td),XB(td-tp),'']);
  /* تفاصيل الغسيل */
  const inCyc=w=>{const n=toN(w.date);return w.cyc!=null?w.cyc===C.k:(n>=cs&&n<ncs)};
  const det=[XH_(['تاريخ الغسيل','اليوم','كود الاسطمبة','اسم الاسطمبة','المجموعة','اللي سجّل','الموعد المخطط','التأخير بالأيام (سالب = اتغسلت بدري)'])];
  S.washes.filter(inCyc).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.code).localeCompare(String(b.code))).forEach(w=>{
    const m=byCode.get(w.code),pd=m?pdm(m):null,n=toN(w.date);
    det.push([w.date,DAYN[dow(n)],String(w.code),m?m.n:'(اسطمبة محذوفة)',m?m.g:'',w.by||'',pd?fromN(cs+pd-1):'بدون موعد',pd?n-(cs+pd-1):''])});
  /* المتبقي */
  const when=new Map();C.days.forEach(d=>d.items.forEach(m=>when.set(m.c,d.n)));
  const rem=[XH_(['كود الاسطمبة','اسم الاسطمبة','المجموعة','الموعد المخطط','الحالة','الموعد المتوقع'])];
  C.rem.slice().sort((a,b)=>(pdm(a)||1e9)-(pdm(b)||1e9)).forEach(m=>{
    const pd=pdm(m),late=C.lateDays(m);
    rem.push([String(m.c),m.n,m.g,pd?fromN(cs+pd-1):'بدون موعد',late?'متأخرة '+late+' يوم':(C.pinOf(m)!=null?'مثبتة':'في الموعد'),when.has(m.c)?fromN(when.get(m.c)):''])});
  /* ملخص */
  const pct=frac(C.doneCount,tot),sum=[
    [XB('تقرير غسيل الاسطمبات')],[],
    [XL('الدورة'),C.k+1],[XL('من'),fromN(cs)],[XL('إلى'),fromN(ncs-1)],[XL('تاريخ التقرير'),fromN(T)],
    [XL('إجمالي الاسطمبات'),tot],[XL('المحقق (اتغسل)'),C.doneCount],[XL('المتبقي'),C.rem.length],[XL('المتأخر عن موعده'),C.overdue.length],
    [XL('نسبة الإنجاز'),XP(pct)],[XL('المفروض يكون اتغسل لحد النهارده'),C.expected],[XL('الفرق (قدّام + / ورا −)'),C.doneCount-C.expected],
    [XL('الانتهاء المتوقع'),C.finish==null?'خلصت':fromN(C.finish)],[],
    XH_(['المجموعة','الإجمالي','المحقق','المتبقي','النسبة'])];
  const g={},gs=[];C.order.forEach(m=>{if(!g[m.g]){g[m.g]={t:0,d:0};gs.push(m.g)}g[m.g].t++;if(C.done.has(m.c))g[m.g].d++});
  gs.forEach(k=>sum.push([k,g[k].t,g[k].d,g[k].t-g[k].d,XP(frac(g[k].d,g[k].t))]));
  return [
   {name:'ملخص',rows:sum,widths:[34,16,14,14,12]},
   {name:'يومي',rows:daily,widths:[16,12,10,10,16,14,14,14,16,16],freeze:true},
   {name:'أسبوعي',rows:weekly,widths:[14,14,14,12,12,10,10],freeze:true},
   {name:'تفاصيل الغسيل',rows:det,widths:[14,12,14,46,24,16,16,12],freeze:true},
   {name:'المتبقي',rows:rem,widths:[14,46,24,16,16,16],freeze:true}]}

async function addMold(code,name,grp,pin){
  if(!canWriteNow())return false;

  if(pin){const pn=toN(pin);if(pn<Math.max(C.T,C.cs)||pn>=C.ncs){toast('يوم الغسيل لازم يكون من النهارده لحد آخر الدورة الحالية.');return false}}
  const s=S.molds.reduce((a,m)=>Math.max(a,m.s),0)+1;
  const items=(S.chunks.cx||[]).concat([{c:code,n:name.trim(),g:grp,s,d:null,p:pin||null}]);

async function setPin(code,iso){
  if(!canWriteNow())return;

  const id=Object.keys(S.chunks).find(k=>S.chunks[k].some(m=>m.c===code));if(!id)return;
  await guard(()=>S.db.collection('moldchunks').doc(id).set({items:S.chunks[id].map(m=>m.c===code?Object.assign({},m,{p:iso||null}):m)}),iso?'اتثبتت في اليوم اللي اخترته':'اتشال التثبيت')}

   +'<div class="panel stat"><b>'+pct+'%</b><span>إنجاز الدورة ('+C.doneCount+' من '+tot+')</span></div>'
   +'<div class="panel stat"><b>'+C.rem.length+'</b><span>متبقي</span></div>'
   +'<div class="panel stat"><b style="color:'+(C.overdue.length?'var(--bad)':'var(--ok)')+'">'+C.overdue.length+'</b><span>متأخر عن موعده</span></div>'
   +'<div class="panel stat"><b>'+(diff>=0?'+':'')+diff+'</b><span>'+(diff>=0?'قدّام الخطة':'ورا الخطة')+' (المفروض '+C.expected+')</span></div></div>';
  h+='<div class="panel pad" style="display:grid;gap:8px"><div class="row-flex"><span>الدورة '+(C.k+1)+'</span><span>'+esc(fDate(C.cs))+' ← '+esc(fDate(C.ncs-1))+'</span></div>'
   +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
   +'<div class="row-flex"><span class="sub">الانتهاء المتوقع بالمعدل الحالي</span><b>'+(C.finish==null?'خلصت':esc(fDate(C.finish)))+'</b></div></div>';
  if(C.finish!=null&&C.finish>=C.ncs)h='<div class="note bad">بالمعدل ده الدورة هتخلص بعد ما الدورة الجاية تبدأ ('+esc(fDate(C.ncs))+'). محتاج تزود الحد اليومي أو تأجل بعض الاسطمبات.</div>'+h;
  if(C.prevMissed)h='<div class="note warn">'+C.prevMissed+' اسطمبة ما اتسجلش ليها غسيل في الدورة السابقة.</div>'+h;
  const gs=[];const seen={};C.order.forEach(m=>{if(!seen[m.g]){seen[m.g]={t:0,d:0};gs.push(m.g)}seen[m.g].t++;if(C.done.has(m.c))seen[m.g].d++});
  h+=weeklyHtml();
  h+='<h2>حسب المجموعة</h2><div class="panel" style="padding-block:6px">';
  gs.forEach(g=>{const o=seen[g],p=Math.round(o.d/o.t*100);h+='<div class="gbar"><span>'+esc(g)+'</span><div class="bar'+(p===100?' ok':'')+'"><i style="width:'+p+'%"></i></div><span>'+o.d+' / '+o.t+'</span></div>'});
  h+='</div><h2>مواعيد الدورات القادمة</h2><div class="panel scroll"><table><thead><tr><th>الدورة</th><th>تبدأ</th></tr></thead><tbody>';
  for(let i=0;i<5;i++){const k=C.k+i;h+='<tr><td>'+(k+1)+(i===0?' (الحالية)':'')+'</td><td>'+esc(fLong(cycleStart(S.cfg.baseStart,k)))+'</td></tr>'}
  return h+'</tbody></table></div>'}

function viewMoldsShell(){
  const groups=[...new Set(S.molds.map(m=>m.g))];
  return '<div class="filters"><input type="search" id="q" placeholder="ابحث بالاسم أو الكود" value="'+esc(S.q)+'" aria-label="بحث">'
   +'<select id="grp" aria-label="المجموعة"><option value="">كل المجموعات</option>'+groups.map(g=>'<option'+(g===S.grp?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>'
   +'<select id="stat" aria-label="الحالة">'+[['all','كل الحالات'],['rem','متبقي'],['late','متأخر'],['done','تم']].map(o=>'<option value="'+o[0]+'"'+(o[0]===S.stat?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'
   +'<div class="row-flex" style="margin-bottom:10px"><span class="sub" id="cnt"></span><button class="btn sm primary" data-act="toggleAdd">+ إضافة اسطمبة</button></div>'
   +'<div id="addBox"></div><div class="panel" id="mlist"></div><p id="moreWrap"></p>'}
function addBoxHtml(){
  if(!S.addOpen)return '';
  const groups=[...new Set(S.molds.map(m=>m.g))];
  return '<div class="panel pad" style="margin-bottom:12px"><div class="form">'
   +'<label class="f">الكود<input type="text" id="aCode" dir="ltr" autocomplete="off"></label>'
   +'<label class="f">اسم الاسطمبة<input type="text" id="aName" autocomplete="off"></label>'
   +'<label class="f">المجموعة<select id="aGrp">'+groups.map(g=>'<option>'+esc(g)+'</option>').join('')+'</select></label>'
   +'<label class="f">يوم الغسيل (اختياري)<input type="date" id="aPin" min="'+fromN(Math.max(C.T,C.cs))+'" max="'+fromN(C.ncs-1)+'"></label></div>'
   +'<p class="sub">لو سبت «يوم الغسيل» فاضي، بتتضاف في آخر قائمة الدورة الحالية. ولو اخترت يوم، بتتجدول فيه وتاخد مكان من عدد اليوم ده.</p><div style="display:flex;gap:8px"><button class="btn primary" data-act="saveAdd">حفظ</button><button class="btn" data-act="toggleAdd">إلغاء</button></div></div>'}
function pinBlockHtml(m){const pn=C.pinOf(m),mn=fromN(Math.max(C.T,C.cs)),mx=fromN(C.ncs-1);
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><label class="f" style="flex:1;min-width:150px">تثبيت في يوم معين (في الدورة الحالية)<input type="date" id="pDate" value="'+esc(S.pinDate||(pn!=null?fromN(pn):mn))+'" min="'+mn+'" max="'+mx+'"></label><button class="btn" data-act="setPin" data-code="'+esc(m.c)+'">تثبيت</button>'+(pn!=null?'<button class="btn" data-act="clearPin" data-code="'+esc(m.c)+'">إلغاء التثبيت</button>':'')+'</div>'}
function moldListHtml(){
  const q=S.q.trim().toLowerCase();
  let ms=C.order.filter(m=>{
    if(S.grp&&m.g!==S.grp)return false;
    if(q&&!(m.n.toLowerCase().includes(q)||m.c.toLowerCase().includes(q)))return false;
    const dn=C.done.has(m.c);
    if(S.stat==='done'&&!dn)return false;if(S.stat==='rem'&&dn)return false;if(S.stat==='late'&&!(C.lateDays(m)>0))return false;
    return true});
  const total=ms.length;ms=ms.slice(0,S.lim);
  let h='';
  if(!ms.length)h='<div class="empty">'+(S.molds.length?'مفيش نتايج.':'مفيش اسطمبات لسه.')+'</div>';
  ms.forEach(m=>{
    const d=C.done.get(m.c),late=C.lateDays(m),lw=C.last.get(m.c);
    const st=d?'<span class="tag ok">تم '+esc(fMed(d.n))+'</span>':(late?'<span class="tag late">متأخرة '+late+' يوم</span>':'<span class="tag mute">متبقي</span>');
    const open=S.open===m.c;
    h+='<div style="border-top:1px solid var(--line)"><button class="rowbtn" data-act="open" data-code="'+esc(m.c)+'" aria-expanded="'+open+'"><div class="mt"><div class="nm">'+esc(m.n)+'</div><div class="meta"><span class="code">'+esc(m.c)+'</span><span class="chip" data-k="'+kind(m.g)+'">'+esc(m.g)+'</span>'+pinTag(m)+(lw?'<span>آخر غسيل '+esc(fDate(lw))+'</span>':'')+'</div></div>'+st+'</button>';
    if(open){
      const hs=S.washes.filter(w=>w.code===m.c).sort((a,b)=>a.date<b.date?1:-1);
      const bd=S.backDate||todayISO(),mn=fromN(S.winStart||C.cs);
      h+='<div class="exp"><div class="sub">سجل الغسيل المتاح:</div><div class="hist">'+(hs.length?hs.map(w=>'<span class="tag mute">'+esc(fDate(toN(w.date)))+(S.canWrite===false?'':' <button data-act="delWash" data-code="'+esc(m.c)+'" data-date="'+esc(w.date)+'" aria-label="حذف التسجيل">×</button>')+'</span>').join(''):'<span class="sub">مفيش تسجيلات.</span>')+'</div>'
       +(S.canWrite===false?'':'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><label class="f" style="flex:1;min-width:150px">تاريخ الغسيل<input type="date" id="bDate" value="'+esc(bd)+'" min="'+esc(mn)+'" max="'+esc(todayISO())+'"></label><button class="btn primary" data-act="addWash" data-code="'+esc(m.c)+'">سجل غسيل</button>'+(C.done.has(m.c)?'<button class="btn" data-act="resetWash" data-code="'+esc(m.c)+'">إلغاء الغسيل (رجّعها للخطة)</button>':'')+'<span class="sub" style="flex-basis:100%">التسجيل بيعلّم الاسطمبة إنها اتغسلت في الدورة الحالية بالتاريخ اللي اخترته.</span>'
       +(S.confirmDel===m.c?'<button class="btn danger" data-act="doDel" data-code="'+esc(m.c)+'">تأكيد الحذف</button><button class="btn" data-act="noDel">إلغاء</button>':'<button class="btn danger" data-act="askDel" data-code="'+esc(m.c)+'">حذف الاسطمبة</button>')+'</div>'+pinBlockHtml(m))+'</div>'}
    h+='</div>'});
  return {h,total,shown:ms.length}}
function renderMoldList(){
  const el=$('#mlist');if(!el)return;const r=moldListHtml();el.innerHTML=r.h;
  $('#cnt').textContent=r.total+' اسطمبة';
  $('#moreWrap').innerHTML=r.total>r.shown?'<button class="btn" data-act="moreMolds">عرض المزيد ('+(r.total-r.shown)+')</button>':'';
  const ab=$('#addBox');if(ab&&ab.dataset.open!==String(S.addOpen)){ab.innerHTML=addBoxHtml();ab.dataset.open=String(S.addOpen)}}

function viewSettings(){
  const c=S.cfg,dis=S.isAdmin?'':' disabled';
  return '<div class="panel pad" style="display:grid;gap:14px"><div class="form">'
   +'<label class="f">بداية الدورة الأولى (سبت)<input type="date" id="sBase" value="'+esc(c.baseStart)+'"'+dis+'></label>'
   +'<label class="f">عدد الاسطمبات يوم سبت–خميس<input type="number" id="sPer" min="1" max="50" value="'+c.perDay+'"'+dis+'></label>'
   +'<label class="f">عدد الاسطمبات يوم الجمعة<input type="number" id="sFri" min="0" max="50" value="'+c.friCap+'"'+dis+'></label></div>'
   +(S.isAdmin?'<div><button class="btn primary" data-act="saveCfg">حفظ الإعدادات</button></div>':'<div class="sub">التعديل متاح للمسؤول فقط.</div>')
   +'<p class="sub">الدورة بتتكرر كل 3 شهور، وبتبدأ أول سبت بعد المدة دي. تغيير الأعداد بيأثر على الجدول القادم بس.</p></div>'+resetCardHtml()}

const TABS=[['today','اليوم'],['upcoming','القادم'],['stats','المتابعة'],['molds','الاسطمبات'],['settings','الإعدادات']];
function render(){
  const v=$('#view');
  if(S.err){v.dataset.shell='err';v.innerHTML='<div class="panel empty">'+esc(S.err)+'</div>';return}
  const ready=S.loaded.c&&S.loaded.g;
  if(!ready){v.dataset.shell='load';
    v.innerHTML='<div class="panel empty">'+(S.slow?'الاتصال بطيء. لسه بنحاول نحمّل البيانات…':'جاري تحميل الاسطمبات…')+'</div>';renderTabs();return}
  compute();
  $('#cycleLine').textContent=C.pre?'الدورة 1 تبدأ '+fLong(C.cs):'الدورة '+(C.k+1)+' · من '+fDate(C.cs)+' لحد '+fDate(C.ncs-1);
  let notes='';
  if(S.canWrite===false)notes+='<div class="note info">عندك صلاحية العرض فقط، مش هتقدر تسجل غسيل.</div>';
  if(!S.molds.length)notes+='<div class="note warn">قاعدة البيانات فاضية. <button class="btn sm primary" data-act="seed">تجهيز البيانات لأول مرة (809 اسطمبة)</button></div>';
  if(!S.loaded.w)notes+='<div class="note info">بنحمّل سجل الغسيل…</div>';
  $('#notes').innerHTML=notes;
  renderTabs();
  if(S.tab==='molds'){
    if(v.dataset.shell!=='molds'){v.innerHTML=viewMoldsShell();v.dataset.shell='molds'}
    renderMoldList();
  }else{
    v.dataset.shell=S.tab;
    v.innerHTML=S.tab==='today'?viewToday():S.tab==='upcoming'?viewUpcoming():S.tab==='stats'?viewStats():viewSettings();
  }
  fillNames()}
function renderTabs(){
  const late=C&&C.overdue?C.overdue.length:0;
  $('#tabs').innerHTML=TABS.map(t=>'<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+(t[0]==='today'&&late?'<span class="badge">'+late+'</span>':'')+'</button>').join('')}
async function fillNames(){
  const els=[...document.querySelectorAll('[data-by]')];if(!els.length||!S.user)return;
  const ids=[...new Set(els.map(e=>e.dataset.by).filter(Boolean))].filter(id=>!(id in S.names));
  if(ids.length){try{const ps=await S.user.profiles(ids);ids.forEach(id=>{S.names[id]=(ps[id]&&ps[id].name)||''})}catch(e){ids.forEach(id=>S.names[id]='')}}
  document.querySelectorAll('[data-by]').forEach(e=>{const n=S.names[e.dataset.by];if(n){e.className='sub';e.textContent='· '+n}})}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const tb=ev.target.closest('[data-tab]');
  if(tb){S.tab=tb.dataset.tab;try{localStorage.setItem('molds.tab',S.tab)}catch(e){}render();return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,code=b.dataset.code;
  if(a==='seed')return seedAll();
  if(a==='askReset'){S.confirmReset=true;return render()}
  if(a==='noReset'){S.confirmReset=false;return render()}
  if(a==='doReset')return resetAll();
  if(a==='exportXlsx')return exportReport();
  if(a==='wash')return wash(code,fromN(C.T));
  if(a==='undo')return unwash(code,fromN(C.T));
  if(a==='moreDays'){S.upN+=14;return render()}
  if(a==='moreMolds'){S.lim+=60;return renderMoldList()}
  if(a==='open'){S.open=S.open===code?null:code;S.confirmDel=null;S.backDate='';S.pinDate='';return renderMoldList()}
  if(a==='addWash'){const d=$('#bDate').value;if(!d){toast('اختار التاريخ.');return}
    if(toN(d)>C.T){toast('التاريخ لازم يكون النهارده أو قبله.');return}S.backDate='';return wash(code,d)}
  if(a==='delWash')return unwash(code,b.dataset.date);
  if(a==='resetWash')return resetWash(code);
  if(a==='setPin'){const d=$('#pDate').value;if(!d){toast('اختار اليوم.');return}S.pinDate='';return setPin(code,d)}
  if(a==='clearPin'){S.pinDate='';return setPin(code,null)}
  if(a==='askDel'){S.confirmDel=code;return renderMoldList()}
  if(a==='noDel'){S.confirmDel=null;return renderMoldList()}
  if(a==='doDel'){S.confirmDel=null;S.open=null;return delMold(code)}
  if(a==='toggleAdd'){S.addOpen=!S.addOpen;return renderMoldList()}
  if(a==='saveAdd'){const ok=await addMold($('#aCode').value.trim(),$('#aName').value,$('#aGrp').value,$('#aPin').value);if(ok){S.addOpen=false;renderMoldList()}return}
  if(a==='saveCfg')return saveCfg({baseStart:$('#sBase').value,perDay:parseInt($('#sPer').value,10),friCap:parseInt($('#sFri').value,10)});
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S.lim=60;renderMoldList()}
  if(e.target.id==='bDate')S.backDate=e.target.value;
  if(e.target.id==='pDate')S.pinDate=e.target.value;
  if(e.target.id==='whoIn'){S.who=e.target.value.trim();try{localStorage.setItem('molds.who',S.who)}catch(x){}}});
document.addEventListener('change',e=>{
  if(e.target.id==='grp'){S.grp=e.target.value;S.lim=60;renderMoldList()}
  if(e.target.id==='stat'){S.stat=e.target.value;S.lim=60;renderMoldList()}});

/* ---------- data ---------- */
function onChunks(snap){
  const ch={};snap.docs.forEach(d=>{const it=d.data()&&d.data().items;ch[d.id]=Array.isArray(it)?it:[]});
  S.chunks=ch;S.molds=[].concat(...Object.values(ch));S.loaded.c=true;render()}
function subWashes(){
  const cfg=S.cfg,T=toN(todayISO());let k=0;
  if(T>=cycleStart(cfg.baseStart,0)){while(cycleStart(cfg.baseStart,k+1)<=T)k++}
  const ws=k>0?cycleStart(cfg.baseStart,k-1):cycleStart(cfg.baseStart,0)-120;
  if(S.wKey===ws)return;S.wKey=ws;S.winStart=ws;if(S.unW)S.unW();S.loaded.w=false;
  S.unW=S.db.collection('washes').where('date','>=',fromN(ws)).limit(1000).onSnapshot(snap=>{
    S.washes=snap.docs.map(d=>d.data()).filter(x=>x&&x.code&&x.date);S.loaded.w=true;render()},
    e=>{S.err=errMsg(e);render()})}
async function boot(){
  render();
  setTimeout(()=>{if(!(S.loaded.c&&S.loaded.g)){S.slow=true;render()}},10000);
  const fc=window.FIREBASE_CONFIG;
  if(!fc||!fc.projectId||String(fc.projectId).indexOf('PASTE')>=0){S.err='ملف firebase-config.js ناقص أو فيه كلمة PASTE. اتأكد إنه مرفوع جنب index.html وفيه إعدادات Firebase بتاعتك.';return render()}
  if(!window.firebase){S.err='مقدرتش أحمّل Firebase. اتأكد من الإنترنت.';return render()}
  let db;try{firebase.initializeApp(fc);db=firebase.firestore()}catch(e){S.err='إعدادات Firebase غلط.';return render()}
  S.db=db;S.canWrite=true;S.isAdmin=true;
  try{S.who=localStorage.getItem('molds.who')||''}catch(e){}
  const wi=$('#whoIn');if(wi)wi.value=S.who;
  db.collection('moldchunks').onSnapshot(onChunks,e=>{S.err=errMsg(e);render()});
  db.doc('config/main').onSnapshot(snap=>{
    const d=snap.exists?snap.data():{};
    S.cfg={baseStart:/^\d{4}-\d\d-\d\d$/.test(d.baseStart||'')?d.baseStart:DEF.baseStart,perDay:+d.perDay>=1?+d.perDay:DEF.perDay,friCap:d.friCap>=0&&d.friCap!=null?+d.friCap:DEF.friCap};
    S.loaded.g=true;subWashes();render()},
    e=>{S.err=errMsg(e);render()});
  let day=todayISO();setInterval(()=>{if(todayISO()!==day){day=todayISO();if(S.db){subWashes()}render()}},60000);
}
boot();
})();
</script>
</body></html>
